name: product-api

services:
  nammongodb:
    image: mongo:8.0
    container_name: nammongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "quit(db.adminCommand({ ping: 1 }).ok === 1 ? 0 : 1)"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

  product-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: product-api:local
    container_name: product-api
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      nammongodb:
        condition: service_healthy

volumes:
  mongo-data:
    external: true
    name: product-api-mongo-data