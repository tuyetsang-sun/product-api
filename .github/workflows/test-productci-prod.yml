name: Product API - CRUD CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Test CRUD with MongoDB
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      NODE_ENV: test
      PORT: "3000"
      HOST: "127.0.0.1"
      MONGODB_URI: mongodb://127.0.0.1:27017/productdb_ci
      API_BASE_URL: http://127.0.0.1:3000

    services:
      nammongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ ping: 1 }).ok === 1 ? 0 : 1)'"
          --health-interval 10s
          --health-timeout 5s
          --health-start-period 20s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run Product model tests
        run: npm test

      - name: Start Product API
        run: |
          nohup node src/server.js > product-api-ci.log 2>&1 &

      - name: Wait for API and MongoDB healthcheck
        timeout-minutes: 2
        run: |
          for attempt in {1..20}; do
            if node src/healthcheck.js; then
              exit 0
            fi
            sleep 2
          done

          echo "API healthcheck did not pass."
          exit 1

      - name: Run CRUD integration tests
        run: npm run test:integration

      - name: Show Product API logs
        if: always()
        run: |
          if [ -f product-api-ci.log ]; then
            cat product-api-ci.log
          fi