name: Product API - CRUD CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Test CRUD with MongoDB
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      NODE_ENV: test
      PORT: "3000"
      HOST: "127.0.0.1"
      MONGODB_URI: mongodb://127.0.0.1:27017/productdb_ci
      API_BASE_URL: http://127.0.0.1:3000

    services:
      nammongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ ping: 1 }).ok === 1 ? 0 : 1)'"
          --health-interval 10s
          --health-timeout 5s
          --health-start-period 20s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run Product model tests
        run: npm test

      - name: Start Product API
        run: |
          nohup node src/server.js > product-api-ci.log 2>&1 &

      - name: Wait for API and MongoDB healthcheck
        timeout-minutes: 2
        run: |
          for attempt in {1..20}; do
            if node src/healthcheck.js; then
              exit 0
            fi
            sleep 2
          done

          echo "API healthcheck did not pass."
          exit 1

      - name: Run CRUD integration tests
        run: npm run test:integration

      - name: Show Product API logs
        if: always()
        run: |
          if [ -f product-api-ci.log ]; then
            cat product-api-ci.log
          fi
  publish:
    name: Verify image and publish to Docker Hub
    needs: integration
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      PRODUCT_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/product-api:sha-${{ github.sha }}
      API_BASE_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Check Docker Hub configuration
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "Missing repository variable DOCKERHUB_USERNAME"
            exit 1
          fi

      - name: Build Docker image
        run: docker compose -f docker-compose-ci.yaml build product-api

      - name: Start containers and wait for healthchecks
        run: |
          docker compose -f docker-compose-ci.yaml up -d --no-build --wait --wait-timeout 120

      - name: Verify container health
        run: |
          docker compose -f docker-compose-ci.yaml ps
          docker compose -f docker-compose-ci.yaml exec -T product-api node src/healthcheck.js

      - name: Run CRUD tests against Docker image
        run: node --test tests/product.integration.test.js

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push tested image
        run: |
          docker push "$PRODUCT_IMAGE"
          docker tag "$PRODUCT_IMAGE" "$DOCKERHUB_USERNAME/product-api:latest"
          docker push "$DOCKERHUB_USERNAME/product-api:latest"

      - name: Show container logs
        if: always()
        run: docker compose -f docker-compose-ci.yaml logs --no-color --tail 100

      - name: Clean up CI containers
        if: always()
        run: docker compose -f docker-compose-ci.yaml down --volumes
  deploy-local:
    name: Deploy to local Docker Engine
    needs: publish
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10

    concurrency:
      group: product-api-local-deployment
      cancel-in-progress: false

    env:
      LOCAL_DEPLOY_DIR: ${{ vars.LOCAL_DEPLOY_DIR }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      IMAGE_TAG: sha-${{ github.sha }}
      API_BASE_URL: http://127.0.0.1:3000

    steps:
      - name: Pull and deploy tested image
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:LOCAL_DEPLOY_DIR)) {
            throw 'Missing LOCAL_DEPLOY_DIR repository variable.'
          }

          Set-Location -LiteralPath $env:LOCAL_DEPLOY_DIR

          if (-not (Test-Path -LiteralPath '.env.prod')) {
            throw 'Missing local .env.prod file.'
          }

          function Invoke-Docker {
            param([string[]]$DockerArgs)

            & docker --context desktop-linux @DockerArgs

            if ($LASTEXITCODE -ne 0) {
              throw "Docker command failed with exit code $LASTEXITCODE."
            }
          }

          $compose = @(
            'compose',
            '--env-file', '.env.prod',
            '-f', 'docker-compose-prod.yaml'
          )

          Invoke-Docker -DockerArgs @('version')
          Invoke-Docker -DockerArgs ($compose + @('config', '--quiet'))
          Invoke-Docker -DockerArgs ($compose + @('pull', 'product-api'))

          Invoke-Docker -DockerArgs ($compose + @(
            'up', '-d',
            '--no-build',
            '--wait',
            '--wait-timeout', '120'
          ))

          Invoke-Docker -DockerArgs ($compose + @('ps'))

          $actualImage = Invoke-Docker -DockerArgs @(
            'inspect',
            '--format', '{{.Config.Image}}',
            'product-api'
          )

          $expectedImage = "$($env:DOCKERHUB_USERNAME)/product-api:$($env:IMAGE_TAG)"

          if ($actualImage.Trim() -ne $expectedImage) {
            throw "Wrong image. Expected: $expectedImage. Actual: $actualImage"
          }

          Invoke-Docker -DockerArgs @(
            'exec', 'product-api',
            'node', 'src/healthcheck.js'
          )

          node --test tests/product.integration.test.js

          if ($LASTEXITCODE -ne 0) {
            throw 'Local CRUD integration tests failed.'
          }

          Write-Host "Deployment successful: $actualImage"

      - name: Show local API logs
        if: always()
        shell: powershell
        run: docker --context desktop-linux logs --tail 50 product-api